<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とおりすがりカレンダー</title>
<meta name="description" content="とおりすがりの和紅茶 予定カレンダー（スマホ版）">
<meta name="theme-color" content="#3C2C1D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<style>
  :root{
    --paper:#E6D9BF; --paper-2:#EFE5CF; --card:#F6EFDF; --card-2:#FBF6EA;
    --ink:#3A2B1E; --ink-soft:#6E5944; --ink-mute:#97836A;
    --line:rgba(58,43,30,.16); --line-2:rgba(58,43,30,.30);
    --bar:#3C2C1D; --bar-ink:#F3EAD6; --accent:#B0402E; --blue:#3E5C76;
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; min-height:100dvh}
  button{font-family:inherit}
  img{-webkit-user-drag:none; user-select:none}

  /* ==== アニメーション ==== */
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  @keyframes popIn{0%{opacity:0; transform:scale(.5)}70%{transform:scale(1.08)}100%{opacity:1; transform:scale(1)}}
  @keyframes chipIn{from{opacity:0; transform:scale(.8) translateY(3px)}to{opacity:1; transform:none}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes sheetDown{from{transform:none}to{transform:translateY(105%)}}
  @keyframes slideL{from{opacity:0; transform:translateX(26px)}to{opacity:1; transform:none}}
  @keyframes slideR{from{opacity:0; transform:translateX(-26px)}to{opacity:1; transform:none}}
  @keyframes dotPop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes toastIn{0%{opacity:0; transform:translate(-50%,20px) scale(.9)}60%{transform:translate(-50%,-4px) scale(1.02)}100%{opacity:1; transform:translate(-50%,0) scale(1)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
  }

  /* ---- ヘッダー ---- */
  .topbar{
    position:sticky; top:0; z-index:10; background:var(--bar); color:var(--bar-ink);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .brandlogo{height:30px; display:block}
  .topbar .brandsub{font-size:10px; letter-spacing:.18em; opacity:.65; font-weight:700; margin-top:2px}
  .topbar .who{margin-left:auto; font-size:11px; opacity:.7}
  .topbar .logout{background:transparent; border:none; color:var(--bar-ink); opacity:.75; font-size:11px; padding:6px 4px}

  /* ---- 月ナビ ---- */
  .monthnav{display:flex; align-items:center; gap:6px; padding:12px 12px 8px}
  .monthnav .ym{flex:1; text-align:center; font-size:18px; font-weight:800; letter-spacing:.05em}
  .navbtn{
    background:var(--card); border:1px solid var(--line-2); border-radius:10px;
    color:var(--ink-soft); font-size:14px; font-weight:800; padding:9px 14px;
    transition:transform .15s var(--spring), background .15s;
  }
  .navbtn:active{background:var(--paper-2); transform:scale(.92)}

  /* ---- カレンダー ---- */
  .calwrap{overflow:hidden}
  .weekhead{display:grid; grid-template-columns:repeat(7,1fr); padding:0 8px}
  .weekhead span{text-align:center; font-size:10.5px; font-weight:800; letter-spacing:.15em; color:var(--ink-mute); padding:4px 0}
  .weekhead span:first-child{color:var(--accent)}
  .weekhead span:last-child{color:var(--blue)}
  .grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    margin:0 8px 10px; border-left:1px solid var(--line); border-top:1px solid var(--line);
    background:var(--card); border-radius:0 0 8px 8px; overflow:hidden;
  }
  .grid.anim-l{animation:slideL .3s ease-out}
  .grid.anim-r{animation:slideR .3s ease-out}
  .grid.anim-f{animation:fadeIn .3s ease-out}
  .cell{
    min-height:64px; padding:3px 2px 4px; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; align-items:stretch; gap:2px;
    transition:background .2s;
  }
  .cell.out{opacity:.45; background:rgba(58,43,30,.05)}
  .cell.sel{outline:2px solid var(--accent); outline-offset:-2px; background:var(--card-2)}
  .cell .d{
    align-self:center; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:800; color:var(--ink-soft);
    transition:transform .15s var(--spring);
  }
  .cell:active .d{transform:scale(1.25)}
  .cell .d.sun{color:var(--accent)}
  .cell .d.sat{color:var(--blue)}
  .cell .d.today{background:var(--accent); color:#fff}
  .cell.cf{background:rgba(90,82,68,.20)}            /* 出店確定日はグレーアウト */
  .cell.cf .d.sun, .cell.cf .d.sat, .cell.cf .d{color:var(--ink-mute)}
  .cell.cf .d.today{background:var(--accent); color:#fff}
  .chip{
    font-size:9px; font-weight:700; line-height:1.25; color:var(--bar-ink); background:var(--bar);
    border-radius:4px; padding:2px 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    animation:chipIn .25s var(--spring) backwards;
  }
  .chip.applying{background:#C08A3E; color:#FFF8EA; border:1px dashed rgba(255,248,234,.7)}
  .chip.confirmed{background:#7A7264; color:#F4F1EA}
  .more{font-size:9px; color:var(--ink-mute); text-align:center; font-weight:700}

  /* ---- 凡例 ---- */
  .legend{display:flex; gap:12px; justify-content:center; padding:0 12px 8px; font-size:10px; font-weight:700; color:var(--ink-soft)}
  .legend span{display:inline-flex; align-items:center; gap:4px}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* ---- 選択日の予定一覧 ---- */
  .daypane{flex:1; padding:2px 12px calc(env(safe-area-inset-bottom) + 84px)}
  .daypane h2{font-size:14px; font-weight:800; margin:10px 2px 8px; color:var(--ink-soft)}
  .entry{
    background:var(--card-2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start;
    animation:fadeUp .3s ease-out backwards;
    transition:transform .15s;
  }
  .entry:active{transform:scale(.98)}
  .entry .time{font-size:11.5px; font-weight:800; color:var(--accent); min-width:44px; padding-top:2px; letter-spacing:.02em}
  .entry .body{flex:1; min-width:0}
  .entry .title{font-size:14.5px; font-weight:800}
  .entry.st-confirmed{background:rgba(122,114,100,.16); border-color:rgba(122,114,100,.4)}
  .badge{display:inline-block; font-size:9.5px; font-weight:800; border-radius:5px; padding:2px 6px; margin-right:6px; vertical-align:2px}
  .badge.applying{background:#C08A3E; color:#FFF8EA}
  .badge.confirmed{background:#7A7264; color:#F4F1EA}
  .entry .memo{font-size:12px; color:var(--ink-mute); margin-top:2px; white-space:pre-wrap; word-break:break-word}
  .empty{padding:16px 0 8px; text-align:center; color:var(--ink-mute); font-size:12.5px; animation:fadeIn .4s ease-out}
  .empty img{width:64px; opacity:.55; display:block; margin:0 auto 6px}

  /* ---- 追加ボタン ---- */
  .fab{
    position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:10;
    width:58px; height:58px; border-radius:50%; border:none; background:var(--accent); color:#fff;
    font-size:30px; font-weight:400; line-height:1; box-shadow:0 6px 18px rgba(58,43,30,.35);
    display:flex; align-items:center; justify-content:center;
    animation:popIn .45s var(--spring) .25s backwards;
    transition:transform .15s var(--spring);
  }
  .fab:active{transform:scale(.88) rotate(90deg)}

  /* ---- モーダル（登録・編集シート） ---- */
  .overlay{
    position:fixed; inset:0; z-index:20; background:rgba(40,28,16,.5);
    display:flex; align-items:flex-end; justify-content:center;
    animation:fadeIn .25s ease-out;
  }
  .overlay.closing{animation:fadeOut .22s ease-in forwards}
  .sheet{
    width:100%; max-width:520px; background:var(--card-2); border-radius:18px 18px 0 0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 18px); max-height:88dvh; overflow-y:auto;
    animation:sheetUp .4s var(--spring);
    position:relative;
  }
  .overlay.closing .sheet{animation:sheetDown .22s ease-in forwards}
  .sheet .grab{width:40px; height:4px; border-radius:2px; background:var(--line-2); margin:0 auto 12px}
  .sheet .walker{
    position:absolute; top:-44px; right:16px; width:44px; pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(58,43,30,.25));
    animation:floaty 2.6s ease-in-out infinite;
  }
  .sheet h3{margin:0 0 14px; font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px}
  .sheet h3 .teadot{width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; animation:dotPop .4s var(--spring)}
  .field{margin-bottom:12px; animation:fadeUp .35s ease-out backwards}
  .field:nth-of-type(1){animation-delay:.04s}.field:nth-of-type(2){animation-delay:.08s}
  .row .field{animation-delay:.12s}
  .flabel{font-size:11px; font-weight:800; color:var(--ink-mute); letter-spacing:.08em; margin-bottom:5px}
  .flabel .req{color:var(--accent)}
  .input{
    width:100%; border:1.5px solid var(--line-2); border-radius:10px; background:#fff;
    padding:11px 12px; font-size:16px; color:var(--ink); font-family:inherit;
    transition:border-color .2s, box-shadow .2s;
  }
  .input:focus{outline:none; border-color:var(--ink-soft); box-shadow:0 0 0 3px rgba(110,89,68,.15)}
  textarea.input{resize:vertical}
  .row{display:flex; gap:10px}
  .row>.field{flex:1}
  .seg{display:flex; gap:8px}
  .segbtn{
    flex:1; padding:10px 4px; border-radius:10px; font-size:12.5px; font-weight:800;
    border:1.5px solid var(--line-2); background:transparent; color:var(--ink-soft);
    transition:transform .12s var(--spring), background .15s, color .15s;
  }
  .segbtn:active{transform:scale(.94)}
  .segbtn.on{border-color:transparent; color:#FFF8EA}
  .segbtn.on[data-v=""]{background:var(--bar)}
  .segbtn.on[data-v="applying"]{background:#C08A3E}
  .segbtn.on[data-v="confirmed"]{background:#7A7264}
  .seghint{font-size:10.5px; color:var(--ink-mute); margin-top:5px; min-height:14px}
  .applybar{
    display:flex; gap:8px; align-items:center; padding:10px 12px; border-radius:10px;
    background:rgba(192,138,62,.14); border:1px dashed #C08A3E; margin-bottom:12px;
    animation:fadeUp .3s ease-out;
  }
  .applybar .txt{font-size:11.5px; font-weight:800; color:#8A6227; flex:1}
  .applybar button{border:none; border-radius:9px; padding:9px 12px; font-size:12px; font-weight:800}
  .applybar .ok{background:var(--accent); color:#fff}
  .applybar .ng{background:transparent; border:1.5px solid var(--line-2); color:var(--accent)}
  .actions{display:flex; gap:10px; margin-top:16px}
  .btn{border:none; border-radius:12px; padding:13px 18px; font-size:14.5px; font-weight:800; transition:transform .15s var(--spring), opacity .2s}
  .btn:active{transform:scale(.94)}
  .btn-save{flex:1; background:var(--bar); color:var(--bar-ink)}
  .btn-save:disabled{opacity:.45}
  .btn-del{background:transparent; border:1.5px solid var(--line-2); color:var(--accent)}
  .btn-cancel{background:transparent; border:1.5px solid var(--line-2); color:var(--ink-soft)}
  .err{color:var(--accent); font-size:12.5px; margin:6px 0}

  /* ---- トースト ---- */
  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); z-index:30;
    transform:translate(-50%,0);
    background:var(--bar); color:var(--bar-ink); font-size:13px; font-weight:800;
    padding:10px 18px; border-radius:999px; box-shadow:0 6px 18px rgba(58,43,30,.3);
    display:flex; align-items:center; gap:8px;
    animation:toastIn .45s var(--spring);
  }
  .toast img{width:22px}
  .toast.hide{transition:opacity .3s, transform .3s; opacity:0; transform:translate(-50%,10px)}

  /* ---- ログイン ---- */
  .login{flex:1; display:flex; flex-direction:column; align-items:center; padding:34px 24px}
  .login .hero{width:96px; margin-bottom:6px; animation:fadeUp .5s ease-out backwards}
  .login .logoimg{width:min(78vw,300px); display:block; animation:fadeUp .5s ease-out .12s backwards}
  .login .sub{font-size:11px; color:var(--ink-mute); letter-spacing:.35em; font-weight:800; margin:10px 0 26px; animation:fadeUp .5s ease-out .22s backwards}
  .stafflist{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:26px}
  .staff{
    border:none; background:var(--card-2); border-radius:14px; padding:14px 10px; width:88px;
    display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:0 2px 8px rgba(58,43,30,.12);
    animation:fadeUp .4s var(--spring) backwards;
    transition:transform .15s var(--spring), outline-color .15s;
  }
  .staff:active{transform:scale(.93)}
  .staff .av{width:44px; height:44px; border-radius:50%; background:var(--bar); color:var(--bar-ink); display:flex; align-items:center; justify-content:center; font-size:19px}
  .staff .nm{font-size:12.5px; font-weight:800; color:var(--ink)}
  .staff.sel{outline:2.5px solid var(--accent)}
  .staff.sel .av{animation:wobble .4s ease-in-out}
  .loadwalk{width:70px; opacity:.7; margin:10px auto; display:block; animation:fadeIn .3s}
  .pinrow{display:flex; gap:12px; margin:6px 0 18px}
  .pindot{width:14px; height:14px; border-radius:50%; border:2px solid var(--ink-soft); transition:background .15s}
  .pindot.on{background:var(--ink); border-color:var(--ink); animation:dotPop .3s var(--spring)}
  .pinpad{display:grid; grid-template-columns:repeat(3,72px); gap:12px}
  .pinkey{
    height:64px; border-radius:50%; border:none; background:var(--card-2); color:var(--ink);
    font-size:22px; font-weight:800; box-shadow:0 2px 8px rgba(58,43,30,.12);
    transition:transform .12s var(--spring), background .12s;
  }
  .pinkey:active{background:var(--paper-2); transform:scale(.9)}
  .pinkey.ghost{background:transparent; box-shadow:none; font-size:14px; color:var(--ink-mute)}
  #pinArea{animation:fadeUp .35s var(--spring)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app">

  <!-- ログイン画面 -->
  <div id="login" class="login hidden">
    <img class="hero" src="walking.gif" alt="">
    <img class="logoimg" src="logo.png" alt="とおりすがりの和紅茶">
    <div class="sub">予定カレンダー</div>
    <div id="staffList" class="stafflist"></div>
    <div id="pinArea" class="hidden" style="display:flex; flex-direction:column; align-items:center">
      <div class="pinrow" id="pinDots"></div>
      <div class="pinpad" id="pinPad"></div>
    </div>
    <div id="loginErr" class="err"></div>
  </div>

  <!-- カレンダー画面 -->
  <div id="main" class="hidden" style="display:flex; flex-direction:column; flex:1">
    <div class="topbar">
      <div>
        <img class="brandlogo" src="logo-cream.png" alt="とおりすがりの和紅茶">
        <div class="brandsub">予定カレンダー</div>
      </div>
      <span class="who" id="whoami"></span>
      <button class="logout" id="btnLogout">ログアウト</button>
    </div>
    <div class="monthnav">
      <button class="navbtn" id="btnPrev">◀</button>
      <div class="ym" id="ymLabel"></div>
      <button class="navbtn" id="btnNext">▶</button>
      <button class="navbtn" id="btnToday" style="font-size:12px">今日</button>
    </div>
    <div class="calwrap">
      <div class="weekhead"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--bar)"></i>通常の予定</span>
      <span><i style="background:#C08A3E"></i>出店応募中</span>
      <span><i style="background:#7A7264"></i>出店確定（日付グレー）</span>
    </div>
    <div class="daypane">
      <h2 id="dayLabel"></h2>
      <div id="dayList"></div>
    </div>
    <button class="fab" id="btnAdd" aria-label="予定を登録">＋</button>
  </div>

  <!-- 登録・編集シート -->
  <div id="overlay" class="overlay hidden">
    <div class="sheet" id="sheet">
      <img class="walker" src="walking.gif" alt="">
      <div class="grab"></div>
      <h3 id="sheetTitle"><span class="teadot"></span>予定を登録</h3>
      <div class="field">
        <div class="flabel">日付 <span class="req">必須</span></div>
        <input class="input" type="date" id="fDate">
      </div>
      <div class="field">
        <div class="flabel">予定名 <span class="req">必須</span></div>
        <input class="input" type="text" id="fTitle" maxlength="120" placeholder="例：◯◯マルシェ出店">
      </div>
      <div class="field">
        <div class="flabel">種別</div>
        <div class="seg" id="segStatus">
          <button class="segbtn" data-v="">通常の予定</button>
          <button class="segbtn" data-v="applying">出店応募中</button>
          <button class="segbtn" data-v="confirmed">出店確定</button>
        </div>
        <div class="seghint" id="segHint"></div>
      </div>
      <div class="applybar hidden" id="applyBar">
        <span class="txt">出店応募中です</span>
        <button class="ok" id="btnConfirmApply">出店確定にする</button>
        <button class="ng" id="btnCancelApply">応募を取消</button>
      </div>
      <div class="row">
        <div class="field">
          <div class="flabel">開始時刻（任意）</div>
          <input class="input" type="time" id="fStart">
        </div>
        <div class="field">
          <div class="flabel">終了時刻（任意）</div>
          <input class="input" type="time" id="fEnd">
        </div>
      </div>
      <div class="field" style="animation-delay:.16s">
        <div class="flabel">メモ（任意）</div>
        <textarea class="input" id="fMemo" rows="3" maxlength="500"></textarea>
      </div>
      <div id="sheetErr" class="err"></div>
      <div class="actions">
        <button class="btn btn-del hidden" id="btnDelete">削除</button>
        <button class="btn btn-cancel" id="btnCancel">閉じる</button>
        <button class="btn btn-save" id="btnSave">保存する</button>
      </div>
    </div>
  </div>

</div>

<script>
'use strict';

/* ==== API（/toorisugari_tool/cal/ → /toorisugari_tool/api を自動導出） ==== */
const API_BASE = location.pathname.replace(/cal(\/.*)?$/, '').replace(/\/+$/, '') + '/api';
const TOKEN_KEY = 'cal_token';
const NAME_KEY = 'cal_name';

let token = null;
try { token = localStorage.getItem(TOKEN_KEY); } catch (_) {}

async function apiFetch(method, path, body) {
  const headers = { Accept: 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    if (res.status === 401) { clearToken(); showLogin(); }
    const err = new Error((data && data.message) || ('通信エラー (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

function clearToken() {
  token = null;
  try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(NAME_KEY); } catch (_) {}
}

/* ==== 日付ユーティリティ ==== */
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];

/* ==== 状態 ==== */
const now = new Date();
let curY = now.getFullYear();
let curM = now.getMonth();       // 0-11
let selDate = ymd(now);          // 選択中の日付
let entries = [];                // 表示中の月の予定
let editingEntry = null;         // 編集中（nullなら新規）
let fStatus = '';                // シートで選択中の種別 '' | 'applying' | 'confirmed'
let selStaffId = null;
let pin = '';

const STATUS_LABEL = { applying: '応募中', confirmed: '出店確定' };
const STATUS_HINT = {
  '': '',
  applying: '応募中の予定は、あとから「出店確定」か「応募取消」にできます。',
  confirmed: '出店確定にすると、カレンダー上でこの日付がグレーアウトします。',
};
let monthAnim = '';              // 月送りアニメーション方向 'l' | 'r' | 'f'

const $ = (id) => document.getElementById(id);

/* ==== ログイン ==== */
function showLogin() {
  $('main').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginErr').textContent = '';
  selStaffId = null; pin = '';
  $('pinArea').classList.add('hidden');
  loadStaff();
}

async function loadStaff() {
  const list = $('staffList');
  list.innerHTML = '<img class="loadwalk" src="walking.gif" alt="読み込み中">';
  try {
    const staff = await apiFetch('GET', '/staff');
    list.innerHTML = '';
    staff.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'staff';
      b.style.animationDelay = (0.3 + i * 0.07) + 's';
      b.innerHTML = '<span class="av">' + escapeHtml(s.initial || s.name[0]) + '</span><span class="nm">' + escapeHtml(s.name) + '</span>';
      b.onclick = () => {
        selStaffId = s.id; pin = '';
        document.querySelectorAll('.staff').forEach((el) => el.classList.remove('sel'));
        b.classList.add('sel');
        $('pinArea').classList.remove('hidden');
        $('loginErr').textContent = '';
        renderPin();
      };
      list.appendChild(b);
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">スタッフ一覧を取得できませんでした</div>';
  }
}

function renderPin() {
  const dots = $('pinDots');
  dots.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('span');
    d.className = 'pindot' + (i < pin.length ? ' on' : '');
    dots.appendChild(d);
  }
  const pad = $('pinPad');
  if (!pad.childElementCount) {
    ['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach((k) => {
      const b = document.createElement('button');
      b.className = 'pinkey' + (k === 'C' || k === '⌫' ? ' ghost' : '');
      b.textContent = k;
      b.onclick = () => onPinKey(k);
      pad.appendChild(b);
    });
  }
}

async function onPinKey(k) {
  if (k === 'C') pin = '';
  else if (k === '⌫') pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += k;
  renderPin();
  if (pin.length === 4 && selStaffId != null) {
    try {
      const r = await apiFetch('POST', '/auth/pin', { staff_id: selStaffId, pin });
      token = r.token;
      try {
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(NAME_KEY, r.staff.name);
      } catch (_) {}
      showMain(r.staff.name);
    } catch (e) {
      pin = '';
      renderPin();
      $('loginErr').textContent = e.message || 'PINが正しくありません。';
    }
  }
}

/* ==== カレンダー ==== */
function showMain(name) {
  $('login').classList.add('hidden');
  $('main').classList.remove('hidden');
  if (name) $('whoami').textContent = name;
  else {
    try { $('whoami').textContent = localStorage.getItem(NAME_KEY) || ''; } catch (_) {}
  }
  loadMonth();
}

async function loadMonth() {
  const month = curY + '-' + pad2(curM + 1);
  $('ymLabel').textContent = curY + '年' + (curM + 1) + '月';
  try {
    entries = await apiFetch('GET', '/calendar-entries?month=' + month);
  } catch (e) {
    if (e.status !== 401) entries = [];
  }
  renderGrid();
  renderDay();
}

function entriesOf(date) {
  return entries.filter((e) => e.date === date);
}

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  // 月送り方向に合わせてスライドイン
  grid.classList.remove('anim-l', 'anim-r', 'anim-f');
  if (monthAnim) {
    void grid.offsetWidth; // reflowでアニメーション再発火
    grid.classList.add('anim-' + monthAnim);
    monthAnim = '';
  }
  const first = new Date(curY, curM, 1);
  const start = new Date(curY, curM, 1 - first.getDay());
  const todayStr = ymd(new Date());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const dateStr = ymd(d);
    const cell = document.createElement('div');
    const confirmedDay = entriesOf(dateStr).some((e) => e.status === 'confirmed'); // 出店確定日はグレー
    cell.className = 'cell' + (d.getMonth() !== curM ? ' out' : '') + (dateStr === selDate ? ' sel' : '') + (confirmedDay ? ' cf' : '');
    const num = document.createElement('span');
    num.className = 'd' + (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + (dateStr === todayStr ? ' today' : '');
    num.textContent = d.getDate();
    cell.appendChild(num);
    const list = entriesOf(dateStr);
    list.slice(0, 2).forEach((e, j) => {
      const c = document.createElement('span');
      c.className = 'chip' + (e.status ? ' ' + e.status : '');
      c.style.animationDelay = (j * 0.05) + 's';
      c.textContent = e.title;
      cell.appendChild(c);
    });
    if (list.length > 2) {
      const m = document.createElement('span');
      m.className = 'more';
      m.textContent = '+' + (list.length - 2);
      cell.appendChild(m);
    }
    cell.onclick = () => {
      selDate = dateStr;
      if (d.getMonth() !== curM) { curY = d.getFullYear(); curM = d.getMonth(); monthAnim = 'f'; loadMonth(); }
      else { renderGrid(); renderDay(); }
    };
    grid.appendChild(cell);
  }
}

function renderDay() {
  const [y, m, d] = selDate.split('-').map(Number);
  const dow = WEEK[new Date(y, m - 1, d).getDay()];
  $('dayLabel').textContent = m + '月' + d + '日（' + dow + '）の予定';
  const list = entriesOf(selDate);
  const wrap = $('dayList');
  wrap.innerHTML = '';
  if (!list.length) {
    wrap.innerHTML = '<div class="empty"><img src="walking.gif" alt="">予定はありません。右下の「＋」から登録できます。</div>';
    return;
  }
  list.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'entry' + (e.status === 'confirmed' ? ' st-confirmed' : '');
    div.style.animationDelay = (i * 0.06) + 's';
    const time = e.start_time ? e.start_time + (e.end_time ? '<br>〜' + e.end_time : '') : '終日';
    const badge = e.status ? '<span class="badge ' + e.status + '">' + STATUS_LABEL[e.status] + '</span>' : '';
    div.innerHTML =
      '<span class="time">' + time + '</span>' +
      '<span class="body"><span class="title">' + badge + escapeHtml(e.title) + '</span>' +
      (e.memo ? '<div class="memo">' + escapeHtml(e.memo) + '</div>' : '') + '</span>';
    div.onclick = () => openSheet(e);
    wrap.appendChild(div);
  });
}

/* ==== 登録・編集シート ==== */
function setSegStatus(v) {
  fStatus = v;
  document.querySelectorAll('#segStatus .segbtn').forEach((b) => {
    b.classList.toggle('on', b.dataset.v === v);
  });
  $('segHint').textContent = STATUS_HINT[v] || '';
}

function openSheet(entry) {
  editingEntry = entry || null;
  $('sheetTitle').innerHTML = '<span class="teadot"></span>' + (entry ? '予定を編集' : '予定を登録');
  $('fDate').value = entry ? entry.date : selDate;
  $('fTitle').value = entry ? entry.title : '';
  $('fStart').value = (entry && entry.start_time) || '';
  $('fEnd').value = (entry && entry.end_time) || '';
  $('fMemo').value = (entry && entry.memo) || '';
  $('sheetErr').textContent = '';
  setSegStatus((entry && entry.status) || '');
  // 応募中の予定のみ、確定／取消のクイック操作を表示
  $('applyBar').classList.toggle('hidden', !(entry && entry.status === 'applying'));
  $('btnDelete').classList.toggle('hidden', !entry);
  $('btnDelete').textContent = entry && entry.status === 'applying' ? '応募を取消' : '削除';
  const ov = $('overlay');
  ov.classList.remove('closing');
  ov.classList.remove('hidden');
}

function closeSheet() {
  const ov = $('overlay');
  if (ov.classList.contains('hidden')) return;
  ov.classList.add('closing');
  setTimeout(() => {
    ov.classList.add('hidden');
    ov.classList.remove('closing');
    editingEntry = null;
  }, 230);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<img src="walking.gif" alt="">' + escapeHtml(msg);
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('hide'), 1600);
  setTimeout(() => t.remove(), 2000);
}

async function saveEntry() {
  const date = $('fDate').value;
  const title = $('fTitle').value.trim();
  if (!date || !title) {
    $('sheetErr').textContent = '日付と予定名を入力してください。';
    return;
  }
  const start = $('fStart').value || null;
  const input = {
    date, title,
    status: fStatus || null,
    start_time: start,
    end_time: start ? ($('fEnd').value || null) : null,
    memo: $('fMemo').value.trim() || null,
  };
  const btn = $('btnSave');
  btn.disabled = true;
  try {
    if (editingEntry) await apiFetch('PATCH', '/calendar-entries/' + editingEntry.id, input);
    else await apiFetch('POST', '/calendar-entries', input);
    selDate = date;
    const d = new Date(date + 'T00:00:00');
    curY = d.getFullYear(); curM = d.getMonth();
    closeSheet();
    showToast('保存しました');
    loadMonth();
  } catch (e) {
    $('sheetErr').textContent = e.message || '保存に失敗しました。';
  } finally {
    btn.disabled = false;
  }
}

async function deleteEntry() {
  if (!editingEntry) return;
  const applying = editingEntry.status === 'applying';
  const msg = applying ? '「' + editingEntry.title + '」の応募を取消しますか？' : '「' + editingEntry.title + '」を削除しますか？';
  if (!confirm(msg)) return;
  try {
    await apiFetch('DELETE', '/calendar-entries/' + editingEntry.id);
    closeSheet();
    showToast(applying ? '応募を取消しました' : '削除しました');
    loadMonth();
  } catch (e) {
    $('sheetErr').textContent = e.message || '削除に失敗しました。';
  }
}

/** 応募中の予定を出店確定に（ステータスのみ更新）。 */
async function confirmApplication() {
  if (!editingEntry) return;
  try {
    await apiFetch('PATCH', '/calendar-entries/' + editingEntry.id, { status: 'confirmed' });
    closeSheet();
    showToast('出店確定にしました');
    loadMonth();
  } catch (e) {
    $('sheetErr').textContent = e.message || '更新に失敗しました。';
  }
}

/* ==== ユーティリティ ==== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ==== イベント ==== */
$('btnPrev').onclick = () => { const d = new Date(curY, curM - 1, 1); curY = d.getFullYear(); curM = d.getMonth(); monthAnim = 'r'; loadMonth(); };
$('btnNext').onclick = () => { const d = new Date(curY, curM + 1, 1); curY = d.getFullYear(); curM = d.getMonth(); monthAnim = 'l'; loadMonth(); };
$('btnToday').onclick = () => { const t = new Date(); curY = t.getFullYear(); curM = t.getMonth(); selDate = ymd(t); monthAnim = 'f'; loadMonth(); };
$('btnAdd').onclick = () => openSheet(null);
$('btnCancel').onclick = closeSheet;
$('btnSave').onclick = saveEntry;
$('btnDelete').onclick = deleteEntry;
$('btnConfirmApply').onclick = confirmApplication;
$('btnCancelApply').onclick = deleteEntry;
document.querySelectorAll('#segStatus .segbtn').forEach((b) => {
  b.onclick = () => setSegStatus(b.dataset.v);
});
$('overlay').onclick = (e) => { if (e.target === $('overlay')) closeSheet(); };
$('btnLogout').onclick = async () => {
  try { await apiFetch('POST', '/auth/logout'); } catch (_) {}
  clearToken();
  showLogin();
};

/* ==== 起動 ==== */
if (token) showMain(null);
else showLogin();

/* ==== PWA ==== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
}
</script>
</body>
</html>
